name: Bug report
description: Report a reproducible problem with GATAS Connect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Use Discussions for questions or ideas.
        Remove personal information, credentials and precise location data from attachments.
        Enter Unknown if a version or device detail is unavailable.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iPhone/iPad, Apple Watch]
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version and build number
      description: Find this under Settings → About GATAS Connect in the phone app.
      placeholder: "1.0.0 (Build N), or Unknown"
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system version
      description: For Apple Watch, include the paired iPhone's iOS version as well.
      placeholder: "Android / iOS / watchOS version, or Unknown"
    validations:
      required: true
  - type: input
    id: device_model
    attributes:
      label: Device model
      description: For Apple Watch, include the paired iPhone model as well.
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: What happened?
      description: Describe the problem and how often it occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: GATAS model and firmware (optional)
      description: Leave empty if this problem does not involve a GATAS connection.
  - type: textarea
    id: attachments
    attributes:
      label: Logs or screenshots (optional)
      description: Remove personal information before uploading.
  - type: textarea
    id: context
    attributes:
      label: Additional information (optional)
